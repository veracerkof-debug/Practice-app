<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Практика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;--cell:#FFFFFF;--ink:#000000;--l2:#8A8A8E;--l3:#C4C4C7;--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --tint:#FF9500;--tint-text:#C46A00;--on-tint:#FFFFFF;--red:#FF3B30;--bar:rgba(249,249,251,.82);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--cell:#1C1C1E;--ink:#FFFFFF;--l2:#8D8D93;--l3:#48484A;--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --tint:#FF9F0A;--tint-text:#FF9F0A;--on-tint:#1A0E00;--red:#FF453A;--bar:rgba(22,22,24,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--cell:#1C1C1E;--ink:#FFFFFF;--l2:#8D8D93;--l3:#48484A;--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --tint:#FF9F0A;--tint-text:#FF9F0A;--on-tint:#1A0E00;--red:#FF453A;--bar:rgba(22,22,24,.8);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding:12px 16px 150px}
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:28px 4px 14px;line-height:1.1}
.sub{color:var(--l2);font-size:15px;margin:-8px 4px 14px}
.hdr{font-size:13px;color:var(--l2);margin:26px 16px 7px}
.ftr{font-size:13px;color:var(--l2);margin:7px 16px 0;line-height:1.4}
.l2{color:var(--l2)}
.tintc{color:var(--tint-text)}

/* grouped list */
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;position:relative;width:100%;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell .grow{flex:1;min-width:0}
.cell .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .st{font-size:14px;color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cell .val{color:var(--l2);flex:none;font-size:16px;text-align:right}
.chev{width:8px;height:13px;flex:none;stroke:var(--l3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.cell:active{background:var(--fill)}
.cell.act{color:var(--tint-text)}
.cell.danger{color:var(--red)}
.cell.center{justify-content:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--l2);letter-spacing:0}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--tint)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:var(--fill);color:var(--tint-text);font-weight:600;font-size:17px}
.btn.fill{background:var(--tint);color:var(--on-tint)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 14px;border-radius:999px;font-size:15px}
.link{color:var(--tint-text);font-size:17px;min-height:44px;display:inline-flex;align-items:center}
.link.b{font-weight:600}
.round{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.round svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.playmini{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--tint);display:inline-flex;align-items:center;justify-content:center;flex:none}
.playmini svg{width:13px;height:13px;fill:currentColor;margin-left:2px}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;width:100%}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:14px;font-weight:500;padding:0 6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}

/* switch */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--fill2);transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw input:checked+i{background:#34C759}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--tint);outline-offset:2px}

/* stepper */
.stepper{display:inline-flex;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:46px;height:32px;font-size:20px;font-weight:400;display:flex;align-items:center;justify-content:center}
.stepper button+button{border-left:.5px solid var(--sep)}

/* home */
.hero{display:flex;align-items:center;gap:20px;padding:18px 16px}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.hero .big{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px 12px 16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--l2);font-weight:500}
.day .d{width:28px;height:28px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center}
.day.done .d{background:var(--tint)}
.day.rest .d{background:none;border:1.5px dashed var(--l3)}
.day.today{color:var(--ink)}
.day.today .d{box-shadow:0 0 0 2px var(--cell),0 0 0 3.5px var(--ink)}
.cta{margin-top:20px}
.lvl{display:inline-flex;gap:2px;vertical-align:middle;align-items:flex-end}
.lvl i{width:4px;height:11px;border-radius:2px;background:var(--fill2)}
.lvl i.on{background:var(--tint)}

/* library */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin:0 0 12px}
.search svg{width:16px;height:16px;stroke:var(--l2);fill:none;stroke-width:2.2;flex:none}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search input::placeholder{color:var(--l2)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:32px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between}
.addbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--tint);display:inline-flex;align-items:center;justify-content:center;margin:0 4px 18px}
.addbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.sortsel{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--tint-text);font-size:15px;padding:0}
.empty{text-align:center;padding:44px 24px;color:var(--l2)}
.empty b{display:block;color:var(--ink);font-size:20px;font-weight:600;margin-bottom:6px}
.empty .btn{margin-top:18px}

/* cards (health-like) */
.card{background:var(--cell);border-radius:12px;padding:14px 16px 16px;margin-top:12px}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600;color:var(--tint-text)}
.card .ch span:last-child{color:var(--l2);font-weight:400;font-size:14px}
.card .cv{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.card .cv small{font-size:15px;color:var(--l2);font-weight:500;letter-spacing:0}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{fill:var(--l2);font-size:11px;font-family:var(--font)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--fill)}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);margin-top:12px;gap:2px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--l2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 1.6fr auto;gap:12px;align-items:center;padding:7px 0;font-size:15px}
.hrow .hb{height:7px;background:var(--fill);border-radius:4px;overflow:hidden}
.hrow .hb i{display:block;height:100%;background:var(--tint);border-radius:4px}
.hrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--cell);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--l2)}

/* song detail */
.navrow{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.navrow .link svg{width:12px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin-right:4px}
.notes{white-space:pre-wrap;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.55;overflow-x:auto;padding:14px 16px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:94%;overflow:auto;border-radius:14px 14px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--l3);margin:6px auto 0}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;position:sticky;top:0;background:var(--bg);z-index:2;margin:0 -16px;padding:0 16px}
.snav .t{font-weight:600;font-size:17px;text-align:center}
.snav .r{justify-self:end}
.snav .l{justify-self:start}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:88%}}
.inp{flex:1;min-width:0;border:0;background:none;outline:none;text-align:right;font-size:17px;color:var(--ink)}
.inp.left{text-align:left}
.inp::placeholder{color:var(--l3)}
.ta{width:100%;border:0;background:none;outline:none;resize:vertical;min-height:130px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.55;padding:12px 16px;display:block}
.cellcol{display:block;padding:12px 16px}
.cellcol .cap{font-size:13px;color:var(--l2);margin-top:8px}

/* session */
.session{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
.session .in{max-width:600px;margin:0 auto;padding:0 16px 40px}
.session .snav{position:sticky;background:var(--bg)}
.kind{text-align:center;font-size:13px;color:var(--l2);margin-top:6px}
.clock{font-size:clamp(68px,21vw,96px);font-weight:200;letter-spacing:-.03em;line-height:1;text-align:center;margin:8px 0 14px}
.clock.paused{color:var(--l2)}
.pausebtn{display:flex;justify-content:center;margin-bottom:22px}
.mcard{background:var(--cell);border-radius:20px;padding:18px 16px 20px}
.mtop{display:flex;justify-content:space-between;align-items:center}
.meterbtn{font-size:17px;font-weight:600;background:var(--fill);border-radius:999px;padding:6px 14px;min-height:34px}
.tname{font-size:15px;color:var(--l2)}
.bpmrow{display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0 4px}
.bpm{font-size:76px;font-weight:300;letter-spacing:-.04em;min-width:3ch;text-align:center;line-height:.95}
.bpmlbl{text-align:center;font-size:13px;color:var(--l2)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--fill2);margin:22px 0 8px;outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);cursor:pointer}
.range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.beats{display:flex;gap:6px;justify-content:center;margin:22px 0 6px;height:64px;align-items:flex-end}
.beat{flex:1;max-width:44px;height:100%;display:flex;align-items:flex-end;border-radius:8px;position:relative}
.beat i{display:block;width:100%;border-radius:8px;background:var(--fill2);transition:background .06s}
.beat[data-l="3"] i{height:100%}.beat[data-l="2"] i{height:66%}.beat[data-l="1"] i{height:36%}
.beat[data-l="0"] i{height:36%;background:none;border:1.5px dashed var(--l3)}
.beat.lit i{background:var(--tint)}
.beat.lit[data-l="0"] i{background:none;border-color:var(--tint)}
.beat.grp{margin-left:8px}
.hint{text-align:center;font-size:12px;color:var(--l2);margin-bottom:14px}
.playrow{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.bigplay{width:76px;height:76px;border-radius:50%;background:var(--tint);color:var(--on-tint);display:flex;align-items:center;justify-content:center}
.bigplay svg{width:30px;height:30px;fill:currentColor}
.side{width:76px;display:flex;justify-content:center}
.tapbtn{width:64px;height:64px;border-radius:50%;background:var(--fill);font-weight:600;font-size:15px}
.barct{font-size:13px;color:var(--l2);text-align:center;min-height:18px;margin-top:10px}
.ask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.alert{background:var(--cell);border-radius:14px;max-width:270px;width:100%;text-align:center;overflow:hidden}
.alert .ab{padding:20px 16px 18px}
.alert h3{margin:0 0 4px;font-size:17px;font-weight:600}
.alert p{margin:0;font-size:13px}
.alert .abtns{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.alert .abtns button{min-height:44px;color:var(--tint-text);font-size:17px}
.alert .abtns button+button{border-left:.5px solid var(--sep);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--cell);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:500;z-index:60;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:fade .2s}

.ticon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.ticon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.notegrid .pill{padding:0}
.pdots{display:flex;justify-content:center;gap:8px}.pdots i{width:8px;height:8px;border-radius:50%;background:var(--fill2)}.pdots i.on{background:var(--tint)}
.rn{width:64px;flex:none;font-weight:600;color:var(--tint-text);font-variant-numeric:tabular-nums}
.circle{width:100%;max-width:340px;display:block;margin:0 auto}.circle .sec{cursor:pointer;outline:none}.circle .sec:focus-visible path{stroke:var(--tint);stroke-width:2.5}
.scnotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.scnotes div{flex:1;min-width:40px;background:var(--fill);border-radius:10px;padding:8px 2px;text-align:center}.scnotes b{display:block;font-size:19px;font-weight:600}.scnotes span{font-size:12px;color:var(--l2)}
.check{width:16px;height:16px;stroke:var(--tint);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kbwrap{overflow-x:auto;padding:2px 0 4px}
.kb{position:relative;display:flex;height:180px;touch-action:none;user-select:none;-webkit-user-select:none;min-width:calc(var(--n) * 30px)}
.kb .w{flex:1;background:#fff;border:1px solid #c7c7cc;border-radius:0 0 8px 8px;margin-right:-1px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;color:#8a8a8e;box-shadow:inset 0 -4px 0 #e5e5ea;cursor:pointer}
.kb .w:last-of-type{margin-right:0}
.kb .b{position:absolute;top:0;height:60%;width:calc(100% / var(--n) * .6);background:linear-gradient(#3a3a3c,#1c1c1e);border-radius:0 0 6px 6px;z-index:2;transform:translateX(-50%);box-shadow:inset 0 -4px 0 rgba(255,255,255,.1);cursor:pointer}
.kb .w.down{background:#e5e5ea;box-shadow:none}.kb .b.down{background:#636366}
.kb .hl::before{content:"";position:absolute;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--tint);opacity:.55}
.kb .w.hl::before{bottom:26px}.kb .b.hl::before{bottom:10px}
.kb .hl.root::before{opacity:1;width:11px;height:11px}

.gauge{width:100%;max-width:300px;display:block;margin:0 auto}
.gauge .needle{transform-origin:150px 156px;transition:transform .12s ease-out}
.gauge .needle line{stroke:var(--ink)}.gauge .needle circle{fill:var(--ink)}
.gauge .needle.ok line{stroke:#34C759}.gauge .needle.ok circle{fill:#34C759}
.tnoteW{font-size:72px;font-weight:300;letter-spacing:-.03em;line-height:1;margin-top:-6px}
.tnoteW.ok{color:#34C759}
.toct{font-size:24px;color:var(--l2);margin-left:2px}
.tcent{font-size:15px;color:var(--l2);margin-top:6px;min-height:20px;font-variant-numeric:tabular-nums}
.tcent.ok{color:#34C759;font-weight:600}
.strings{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.strings .pill{min-width:44px;padding:0 10px}
.strings .pill.near{box-shadow:inset 0 0 0 2px var(--tint)}

.ic{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:600;font-size:15px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);

function fmtDur(sec){sec=Math.round(sec||0);const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);
  if(h&&m===60)return (h+1)+" ч";if(h)return m?h+" ч "+m+" мин":h+" ч";if(sec<60&&sec>0)return "<1 мин";return m+" мин"}

const ACCENTS=[["orange","#FF9500"],["red","#FF3B30"],["pink","#FF2D55"],["purple","#AF52DE"],["indigo","#5856D6"],["blue","#007AFF"],["teal","#00C7BE"],["green","#34C759"],["graphite","#8E8E93"]];

/* ---------- metronome engine ---------- */
function defaultAccents(num,den){const a=Array(num).fill(1);a[0]=3;

const TEMPO_NAMES=[[40,"Grave"],[60,"Largo"],[66,"Larghetto"],[76,"Adagio"],[108,"Andante"],[120,"Moderato"],[156,"Allegro"],[176,"Vivace"],[200,"Presto"],[999,"Prestissimo"]];
const tempoName=b=>TEMPO_NAMES.find(([m])=>b<m)[1];
const M={ctx:null,running:false,cfg:S.settings.metro,next:0,beat:0,subI:0,bar:0,timer:null,queue:[],lastTick:0,noise:null,bpmChanged:false,
  ensure(){if(!this.ctx){const C=ac();if(!C)return false;this.ctx=C;
      const len=this.ctx.sampleRate*0.05,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf}
    if(this.ctx.state==="suspended")this.ctx.resume();return true},
  voice(t,l){const c=this.ctx,snd=this.cfg.sound,out=c.createGain();out.connect(c.destination);
    const vol={3:1,2:.72,1:.5,0.5:.26}[l]*mixV("metro");
    if(snd==="wood"){const n=c.createBufferSource();n.buffer=this.noise;const bp=c.createBiquadFilter();bp.type="bandpass";bp.Q.value=9;bp.frequency.value={3:2400,2:1900,1:1600,0.5:1300}[l];
      out.gain.setValueAtTime(vol*2.4,t);out.gain.exponentialRampToValueAtTime(0.0001,t+0.05);n.connect(bp).connect(out);n.start(t);n.stop(t+0.06);
      const o=c.createOscillator(),g=c.createGain();o.frequency.value={3:1100,2:950,1:820,0.5:700}[l];g.gain.setValueAtTime(vol*.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.03);o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.04)}
    else{const o=c.createOscillator();const beep=snd==="beep";o.type=beep?"sine":"triangle";
      o.frequency.value=beep?{3:1320,2:1100,1:880,0.5:660}[l]:{3:2000,2:1600,1:1250,0.5:950}[l];
      const dec=beep?0.09:0.045;out.gain.setValueAtTime(0.0001,t);out.gain.exponentialRampToValueAtTime(vol*(beep?.6:.9),t+0.002);out.gain.exponentialRampToValueAtTime(0.0001,t+dec);
      o.connect(out);o.start(t);o.stop(t+dec+0.02)}},
  subDur(){const spb=60/this.cfg.bpm,s=this.cfg.sub;if(s===2&&this.cfg.swing)return this.subI===0?spb*2/3:spb/3;return spb/s},
  muted(){const g=this.cfg.gap;if(!g.on)return false;return (this.bar%(g.play+g.mute))>=g.play},
  sched(){const c=this.ctx;while(this.next<c.currentTime+0.12){const cfg=this.cfg;const acc=cfg.accents[this.beat]??1;const silent=this.muted();
      if(!silent){if(this.subI===0){if(acc>0)this.voice(this.next,acc)}else if(acc>0)this.voice(this.next,0.5)}
      this.queue.push({t:this.next,b:this.beat,s:this.subI,bar:this.bar,silent});
      this.next+=this.subDur();this.subI++;
      if(this.subI>=cfg.sub){this.subI=0;this.beat++;if(this.beat>=cfg.num){this.beat=0;this.bar++;
        const tr=cfg.trainer;if(tr.on&&this.bar%tr.every===0&&cfg.bpm<tr.max){tickBpm();cfg.bpm=Math.min(tr.max,cfg.bpm+tr.step);this.bpmChanged=true}}}}},
  start(){if(!this.ensure()){toast("Звук недоступен в этом браузере");return}this.running=true;this.beat=0;this.subI=0;this.bar=0;this.next=this.ctx.currentTime+0.08;this.queue=[];
    this.sched();this.timer=setInterval(()=>this.sched(),25);this.lastTick=Date.now()},
  stop(){tickBpm();this.running=false;clearInterval(this.timer);this.queue=[]},
  setBpm(v){tickBpm();this.cfg.bpm=Math.max(20,Math.min(300,Math.round(v)))}
};
function tickBpm(){if(!A)return;const now=Date.now();if(M.running&&M.lastTick&&!A.pausedAt){const k=String(M.cfg.bpm);A.bpmTime[k]=(A.bpmTime[k]||0)+(now-M.lastTick)/1000}M.lastTick=now;saveActive()}

function weekData(){const ws=weekStart(Date.now()),we=ws+7*DAY;const per=Array(7).fill(0);let total=0;
  sessions().forEach(s=>{if(s.start>=ws&&s.start<we){const idx=(new Date(s.start).getDay()+6)%7;per[idx]+=s.dur;total+=s.dur}});return{per,total,ws}}

function tempoChart(pts,target){const W=320,H=140,p=26;const ys=pts.map(x=>x.bpm).concat(target?[target]:[]);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<10){hi+=5;lo-=5}
  const x=i=>p+(W-p-6)*(i/(pts.length-1)),y=v=>10+(H-10-22)*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Темп вырос от '+pts[0].bpm+" до "+pts[pts.length-1].bpm+' bpm">';
  [hi,lo].forEach(v=>s+='<line x1="'+p+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--sep)"/><text x="0" y="'+(y(v)+4)+'">'+Math.round(v)+"</text>");
  if(target)s+='<line x1="'+p+'" x2="'+W+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="var(--l2)" stroke-dasharray="3 4"/><text x="'+W+'" y="'+(y(target)-6)+'" text-anchor="end">цель '+target+"</text>";
  const pl=pts.map((q,i)=>x(i)+","+y(q.bpm)).join(" ");
  s+='<polygon fill="var(--tint)" opacity=".12" points="'+x(0)+","+(H-22)+" "+pl+" "+x(pts.length-1)+","+(H-22)+'"/><polyline fill="none" stroke="var(--tint)" stroke-width="2.5" stroke-linejoin="round" points="'+pl+'"/>';
  pts.forEach((q,i)=>s+='<circle cx="'+x(i)+'" cy="'+y(q.bpm)+'" r="3.5" fill="var(--cell)" stroke="var(--tint)" stroke-width="2"/>');
  const f=d=>{const z=new Date(d);return z.getDate()+"."+String(z.getMonth()+1).padStart(2,"0")};
  s+='<text x="'+p+'" y="'+(H-4)+'">'+f(pts[0].t)+'</text><text x="'+W+'" y="'+(H-4)+'" text-anchor="end">'+f(pts[pts.length-1].t)+"</text></svg>";return s}

function barsSVG(vals,labels,goalLine,hl,aria){const W=320,H=120,n=vals.length,bw=Math.min(30,(W-8*(n-1))/n),gap=(W-n*bw)/(n-1);
  const top=Math.max(...vals,goalLine||0,1);let s='<svg class="chart" viewBox="0 0 '+W+" "+(H+18)+'" role="img" aria-label="'+aria+'">';
  for(let i=0;i<=2;i++){const y=H-(H-6)*i/2;s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--sep)"/>'}
  if(goalLine){const gy=H-(goalLine/top)*(H-6);s+='<line x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--l2)" stroke-dasharray="3 4"/>'}
  vals.forEach((v,i)=>{const bh=v?Math.max(4,(v/top)*(H-6)):0;const x=i*(bw+gap);s+='<rect x="'+x+'" y="'+(H-bh)+'" width="'+bw+'" height="'+bh+'" rx="'+Math.min(5,bw/2)+'" fill="'+(hl===undefined||hl===i?"var(--tint)":"var(--l3)")+'"/><text x="'+(x+bw/2)+'" y="'+(H+15)+'" text-anchor="middle">'+labels[i]+"</text>"});

let AC=null,BUS=null,REV=null;
function makeIR(c,sec){const len=Math.floor(c.sampleRate*sec),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){const t=i/len;lp=lp*.6+(Math.random()*2-1)*.4;d[i]=lp*Math.pow(1-t,2.4)*(i<c.sampleRate*.012?i/(c.sampleRate*.012):1)}}return ir}

    const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.2;comp.connect(AC.destination);
    BUS=AC.createGain();BUS.gain.value=.9;BUS.connect(comp);
    try{const cv=AC.createConvolver();cv.buffer=makeIR(AC,2.8);const rg=AC.createGain();rg.gain.value=.55;const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=180;
      REV=AC.createGain();REV.connect(hp).connect(cv).connect(rg).connect(comp)}catch(e){REV=null}}
  if(AC.state==="suspended")AC.resume();return AC}
function outNode(c,send,pan){const g=c.createGain();let last=g;
  if(pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=Math.max(-.8,Math.min(.8,pan));g.connect(p);last=p}
  last.connect(BUS);if(REV&&send){const s=c.createGain();s.gain.value=send;last.connect(s).connect(REV)}return g}
const WAVES={};
function wave(c,name){if(WAVES[name])return WAVES[name];const P={piano:[0,1,.62,.36,.26,.17,.1,.08,.05,.035,.025,.015,.01],warm:[0,1,.38,.14,.07,.035,.015],bow:[0,1,.7,.5,.42,.3,.22,.18,.12,.1,.07,.05,.04,.03],tan:[0,1,.8,.55,.6,.42,.38,.3,.28,.22,.2,.16,.14,.12,.1,.09,.08,.07,.06,.05]}[name];
  const re=new Float32Array(P.length),im=new Float32Array(P.map(x=>x));return WAVES[name]=c.createPeriodicWave(re,im)}

const DR={on:false,nodes:null,timer:null,next:0,step:0,
  start(){const c=ac();if(!c)return;const d=T.drone,t=c.currentTime,master=c.createGain();master.connect(BUS);
    let sendN=null;if(REV){sendN=c.createGain();sendN.gain.value=d.sound==="tanpura"?.5:.45;master.connect(sendN).connect(REV)}
    master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(d.vol*mixV("drone"),t+1.8);
    const Ls=[2,3,4].filter(o=>d.layers[o]),notes=[];Ls.forEach(o=>{const b=12*(o+1)+d.pc,lv=o===2?1:o===3?.8:.6;notes.push([b,lv]);if(d.fifth)notes.push([b+7,lv*.5])});const os=[];
    if(d.sound==="tanpura"){this.nodes={g:master,os,send:sendN};this.on=true;this.step=0;this.next=t+.1;this.tan();this.timer=setInterval(()=>this.tan(),120);return}
    const lp=c.createBiquadFilter();lp.type="lowpass";lp.connect(master);
    const breath=c.createOscillator(),bg=c.createGain(),amp=c.createGain();amp.gain.value=1;amp.connect(lp);breath.frequency.value=.11;bg.gain.value=.08;breath.connect(bg).connect(amp.gain);breath.start(t);os.push(breath);
    notes.forEach(([m,lvl])=>{const f=mf(m);
      const voices=d.sound==="pad"?[[-10,-.6],[10,.6]]:d.sound==="bow"?[[-5,-.45],[5,.45]]:[[-4,-.5],[4,.5]];
      voices.forEach(([dt,pn])=>{const o=c.createOscillator();if(d.sound==="pad")o.type="sawtooth";else o.setPeriodicWave(wave(c,d.sound==="bow"?"bow":"warm"));
        o.frequency.value=f;o.detune.value=dt;const g=c.createGain();g.gain.value=lvl*(d.sound==="pad"?.05:d.sound==="bow"?.07:.11);
        if(d.sound==="bow"){const vib=c.createOscillator(),vg=c.createGain();vib.frequency.value=4.6+Math.random()*.6;vg.gain.value=5;vib.connect(vg).connect(o.detune);vib.start(t);os.push(vib)}

    if(d.sound!=="soft"){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.07;lg.gain.value=d.sound==="pad"?380:500;l.connect(lg).connect(lp.frequency);l.start(t);os.push(l)}

  pluck(m,t,lvl){const c=AC,f=mf(m),o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();o.setPeriodicWave(wave(c,"tan"));o.frequency.value=f;o.detune.value=(Math.random()-.5)*4;

  tan(){if(!this.nodes||!AC)return;const d=T.drone,Ls=[2,3,4].filter(o=>d.layers[o]);if(!Ls.length)return;const base=12*(Ls[0]+1)+d.pc,pat=[(DC().chord==="root"||DC().chord==="sus4")?base+5:base+7,base+12,base+12,base],gap=1.15;
    while(this.next<AC.currentTime+.4){const i=this.step%4;this.pluck(pat[i],this.next,i===3?1.1:.9);Ls.slice(1).forEach(o=>this.pluck(pat[i]+12*(o-Ls[0]),this.next+.015,.45));this.next+=i===3?gap*1.6:gap;this.step++}},
  stop(){clearInterval(this.timer);this.timer=null;if(!this.nodes||!AC){this.on=false;return}const {g,os}=this.nodes,t=AC.currentTime,cur=g.gain.value;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(cur,t);g.gain.linearRampToValueAtTime(0,t+1.2);os.forEach(o=>{try{o.stop(t+1.3)}catch(e){}});this.nodes=null;this.on=false},

  vol(){if(this.nodes&&AC)this.nodes.g.gain.setTargetAtTime(T.drone.vol*mixV("drone"),AC.currentTime,.1)}};

function closePane(i){const H=halves();if(!H)return;const isTop=i<H.tc,arr=isTop?H.top:H.bot,other=isTop?H.bot:H.top;

let DRG=null,dragSup=false;

  const hf=d.el.parentNode,r=hf.getBoundingClientRect();return hf.classList.contains("row")?(x-r.left)/r.width:(y-r.top)/r.height}

  else{const ps=d.el.parentNode.querySelectorAll(":scope>.pane");if(ps[0])ps[0].style.flex=c+" 1 0px";if(ps[1])ps[1].style.flex=(1-c)+" 1 0px"}}
document.addEventListener("pointermove",e=>{if(!DRG||e.pointerId!==DRG.pid)return;const dx=e.clientX-DRG.x0,dy=e.clientY-DRG.y0;

  if(!DRG.on){if(Math.hypot(dx,dy)<12)return;if(DRG.kind==="tool"&&!(dy<-10&&Math.abs(dy)>Math.abs(dx)))return;DRG.on=true;
    const g=document.createElement("div");g.className="dghost";g.innerHTML=DRG.kind==="tool"?SICON[DRG.id]+"<span>"+SNAME[DRG.id]+"</span>":"<span>"+SNAME[WS().panes[DRG.src]]+"</span>";document.body.appendChild(g);DRG.g=g}

let TABS=[];
const AT_URL="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js";
const AT={api:null,el:null,cur:null,score:null,track:0,lp:null,fontOk:false,state:"idle",
  loadLib(){if(window.alphaTab)return Promise.resolve();if(this.lp)return this.lp;this.lp=new Promise((res,rej)=>{const s=document.createElement("script");s.src=AT_URL;s.onload=()=>res();s.onerror=()=>{this.lp=null;rej(new Error("lib"))};document.head.appendChild(s)});return this.lp},
  async font(){if(this.fontOk)return;try{const bin=Uint8Array.from(atob(BRAVURA_B64),c=>c.charCodeAt(0)),ff=new FontFace("alphaTab",bin.buffer);await ff.load();document.fonts.add(ff)}catch(e){}this.fontOk=true},
  prof(){return T.tab.prof==="both"?alphaTab.StaveProfile.ScoreTab:alphaTab.StaveProfile.Tab},
  async open(rec){this.state="loading";this.cur=rec;this.score=null;refreshIf("notes");
    try{await this.loadLib();await this.font()}catch(e){this.state="error";refreshIf("notes");toast("Не удалось загрузить модуль табулатур");return}
    if(!this.api){this.el=document.createElement("div");this.el.className="atsurf";const slot=$("#atSlot");if(slot)slot.appendChild(this.el);
      this.api=new alphaTab.AlphaTabApi(this.el,{core:{useWorkers:false,smuflFontSources:new Map([["woff2","data:font/woff2;base64,"+BRAVURA_B64]])},player:{enablePlayer:false},display:{scale:T.tab.scale,layoutMode:alphaTab.LayoutMode.Page,staveProfile:this.prof()}});
      this.api.scoreLoaded.on(sc=>{this.score=sc;this.track=0;this.state="ready";refreshIf("notes")});
      this.api.error.on(()=>{this.state="error";refreshIf("notes");toast("Не удалось открыть файл. Поддерживаются gp3–gp5, gpx, gp (7/8) и MusicXML")})}
    try{const buf=await rec.blob.arrayBuffer();this.api.load(new Uint8Array(buf))}catch(e){this.state="error";refreshIf("notes")}},
  restyle(){if(!this.api)return;this.api.settings.display.scale=T.tab.scale;this.api.settings.display.staveProfile=this.prof();this.api.updateSettings();this.api.render()},
  setTrack(i){if(!this.score)return;this.track=i;this.api.renderTracks([this.score.tracks[i]])}};
const CH_RE=/^\(?[A-H](?:#|b|♯|♭)?(?:maj|min|m|M|dim|aug|sus|add|°|ø|\+)?[0-9]*(?:(?:sus|add|maj|b|#|♭|♯)[0-9]+)*(?:\/[A-H](?:#|b|♯|♭)?)?\)?$/;
function trChord(ch,n){if(!n)return ch.replace(/#/g,"♯").replace(/([A-H])b/g,"$1♭");const flat=/[A-H](b|♭)/.test(ch)||(n<0&&!/[#♯]/.test(ch));
  return ch.replace(/([A-H])(#|b|♯|♭)?/g,(m,L,acc)=>{const base=L==="H"?11:NAT[L];const pc=(base+(acc==="#"||acc==="♯"?1:acc==="b"||acc==="♭"?-1:0)+n+24)%12;return(flat?FL:SH)[pc]})}
function lyricsHTML(txt,n){return txt.split("\n").map(line=>{const toks=line.trim().split(/\s+/).filter(Boolean),isCh=toks.length>0&&toks.every(t=>CH_RE.test(t)||/^[|\-–\/x]+$/.test(t));
  if(isCh)return line.replace(/\S+/g,t=>CH_RE.test(t)?'<b class="chd">'+esc(trChord(t,n))+"</b>":esc(t));
  return esc(line).replace(/\[([^\]]+)\]/g,(m,c)=>CH_RE.test(c)?'<b class="chd">'+esc(trChord(c,n))+"</b>":m)}).join("\n")}
function notesHTML(sz){sz=sz||"full";const song=A&&A.songId?songById(A.songId):null,sec=T.tab.sec||"tabs",big=sz==="full"||sz==="half";
  const sw='<div class="tsw" role="tablist">'+[["tabs","Табы"],["text","Текст и аккорды"]].map(([k,n])=>'<button class="tswb'+(k===sec?" on":"")+'" data-x="nsec" data-v="'+k+'" role="tab" aria-selected="'+(k===sec)+'">'+n+"</button>").join("")+"</div>";
  let body="";
  if(sec==="text"){if(!song)body='<div class="vq l2" style="font-size:14px">Текст и аккорды есть у песен из библиотеки.</div>';
    else{const n=song.tr||0;
      body='<div class="ntools"><div class="vrow tight">'+icb('data-x="ntr" data-d="-1"',IC.minus,"Транспонировать вниз","sm")+'<span class="num trv">'+(n>0?"+":"")+n+'</span>'+icb('data-x="ntr" data-d="1"',IC.plus,"Транспонировать вверх","sm")+"</div>"+
      (big?'<div class="vrow tight">'+icb('data-x="nfs" data-d="-1"',"A−","Мельче","sm txt")+icb('data-x="nfs" data-d="1"',"A+","Крупнее","sm txt")+icb('data-x="nedit"',IC.pen,"Редактировать текст","sm")+"</div>":"")+"</div>"+
      (song.notes?'<div class="lyr" style="font-size:'+(T.tab.fs||15)+'px">'+lyricsHTML(song.notes,n)+"</div>":'<div class="vq l2" style="font-size:14px">Пока пусто.<button class="btn sm" data-x="nedit" style="margin-top:8px">Добавить текст и аккорды</button></div>')}}
  else{if(!big)return '<div class="comp '+sz+'">'+'<div class="csw"><button class="cswb on txt" data-x="nsec" data-v="text" aria-label="Переключить на текст">Табы ›</button></div><div class="vq l2" style="font-size:13px">Табам нужно место'+(sessionOpen?'<button class="btn sm" data-x="nmax" style="margin-top:8px">Развернуть окно</button>':"")+"</div></div>";
    const mine=TABS.filter(t=>song&&t.songId===song.id);
    if(!AT.cur||AT.state==="error"){body='<div class="tablist">'+(TABS.length?(mine.length?'<div class="hdr" style="margin-top:4px">Эта песня</div><div class="group">'+mine.map(tabRow).join("")+"</div>":"")+'<div class="hdr">'+(mine.length?"Другие":"Все табы")+'</div><div class="group">'+TABS.filter(t=>!mine.includes(t)).map(tabRow).join("")+"</div>":'<p class="l2" style="font-size:14px;text-align:center;margin:18px 8px">Загрузи файл Guitar Pro (gp3, gp4, gp5, gpx, gp) или MusicXML.</p>')+
      '<div class="vrow" style="margin-top:12px"><button class="btn sm" data-x="tadd">'+IC.plus.replace("<svg",'<svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4"')+" Загрузить табулатуру</button></div>"+(AT.state==="error"?'<p class="ftr" style="text-align:center">Не удалось открыть файл.</p>':"")+"</div>"}
    else{const tr=AT.score?AT.score.tracks:[];
      body='<div class="ntools">'+icb('data-x="tlist"',IC.list,"Файлы табулатур","sm")+(tr.length>1?'<div class="chips nowrap sgrow">'+tr.map((t,i)=>'<button class="chip'+(i===AT.track?" on":"")+'" data-x="ttrack" data-i="'+i+'">'+esc(t.name||("Дорожка "+(i+1)))+"</button>").join("")+"</div>":'<span class="sgrow aname" style="text-align:left">'+esc(AT.cur.name)+"</span>")+
      icb('data-x="tzoom" data-d="-1"',IC.minus,"Мельче","sm")+icb('data-x="tzoom" data-d="1"',IC.plus,"Крупнее","sm")+'<button class="ic txt sm'+(T.tab.prof==="both"?" act":"")+'" data-x="tprof" aria-label="Показывать ноты и табы">♪+T</button></div>'+
      (big?atBarHTML():"")+'<div class="atwrap" id="atSlot">'+(AT.state==="loading"?'<div class="atload l2">Открываю…</div>':"")+"</div>"}}
  return '<div class="comp '+sz+'">'+(big?sw:'<div class="csw"><button class="cswb on txt" data-x="nsec" data-v="tabs" aria-label="Переключить на табы">Текст ›</button></div>')+'<div class="cbody">'+body+"</div></div>"}
function tabRow(t){const so=t.songId?songById(t.songId):null;return '<div class="cell"><button class="grow" data-x="topen" data-id="'+t.id+'" style="text-align:left;min-width:0"><div class="ttl">'+esc(t.name)+'</div><div class="st">'+(t.size/1024).toFixed(0)+" КБ"+(so?", "+esc(so.title):"")+'</div></button><button class="ic sm" data-x="tdel" data-id="'+t.id+'" aria-label="Удалить '+esc(t.name)+'" style="color:var(--red)">'+IC.minus+"</button></div>"}
function notesAfter(p){const slot=p.querySelector("#atSlot");if(slot&&AT.el&&AT.el.parentNode!==slot)slot.appendChild(AT.el)}
function lyricsEdit(){const song=A&&A.songId?songById(A.songId):null;if(!song)return;
  openSubSheet('<div class="snav"><button class="link l" data-close>Отмена</button><div class="t">Текст и аккорды</div><button class="link b r" id="lsave">Сохранить</button></div><div class="group"><textarea class="ta" id="lta" style="min-height:52vh" placeholder="Am        F\nСтрочка песни...\n\nили в строке: [Am]Строчка [F]песни">'+esc(song.notes||"")+'</textarea></div><p class="ftr">Строки только из аккордов подсвечиваются и транспонируются. Можно писать аккорды прямо в тексте в квадратных скобках: [Am].</p>',
    sc=>sc.querySelector("#lsave").addEventListener("click",()=>{song.notes=sc.querySelector("#lta").value;song.updatedAt=Date.now();save();$("#sheetLayer").innerHTML="";refreshIf("notes")}))}
function tabSheet(){openSubSheet('<div class="snav"><span></span><div class="t">Табулатуры</div><button class="link b r" data-close>Готово</button></div><div class="group">'+TABS.map(tabRow).join("")+'<button class="cell act" data-x="tadd">Загрузить табулатуру</button></div>',
  sc=>sc.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;e.stopPropagation();$("#sheetLayer").innerHTML="";tabAct(b.dataset.x,b)},true))}
function tabAct(a,el){const t=el.dataset.id?TABS.find(x=>x.id===el.dataset.id):null;

function streakInfo(){const goal=S.settings.goalMin*60,ws=weekStart(Date.now()),all=sessions(),wt=[];

function LIB(){const st=S.settings;if(!st.lib){st.lib={};Object.keys(LIBDEF).forEach(k=>st.lib[k]=LIBDEF[k].map(([n,c])=>({id:uid().slice(-6)+Math.random().toString(36).slice(2,5),name:n,color:c,text:""})))}
  const L=st.lib;Object.keys(LIBDEF).forEach(k=>{if(!L[k])L[k]=[]});
  songs().forEach(s=>{if(s.genre&&!L.genres.some(g=>g.name.toLowerCase()===s.genre.toLowerCase())){let h=0;for(const ch of s.genre)h=(h*31+ch.charCodeAt(0))>>>0;L.genres.push({id:"g"+uid(),name:s.genre,color:PALETTE[h%12],text:""})}});
  return L}
const autoText=hex=>{const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||"");if(!m)return"#fff";const [r,g,b]=[1,2,3].map(i=>parseInt(m[i],16)/255),l=.2126*r+.7152*g+.0722*b;return l>.62?"#1c1c1e":"#ffffff"};

  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin:0 6px 8px"><span class="l2" style="font-size:13px">'+list.length+" "+plural(list.length,["песня","песни","песен"])+((view.genre||view.tag)?' · <button class="link" data-fclear style="font-size:13px;min-height:0">сбросить фильтр</button>':"")+'</span><select class="sortsel" data-input="sort" aria-label="Сортировка">'+SORTS.map(([v,l])=>'<option value="'+v+'"'+(view.sort===v?" selected":"")+">"+l+"</option>").join("")+"</select></div>";
  if(!list.length)return h+'<div class="empty">Ничего не найдено.</div>';
  return h+'<div class="slist">'+list.map(({s,st})=>{const g=genreOf(s.genre),c=catOf(s.cat),tags=(s.tags||[]).map(tagOf).filter(Boolean);
    return '<button class="stile3" data-song="'+s.id+'" style="--g:'+(g?g.color:"var(--l3)")+'"><div class="grow"><div class="ttl">'+(c&&!view.cat?'<i class="cdot" style="background:'+c.color+'" title="'+esc(c.name)+'"></i>':"")+esc(s.title)+'</div><div class="st">'+esc([s.artist,g?g.name:s.genre].filter(Boolean).join(" · ")||"Без исполнителя")+"</div>"+

  return '<div class="ewrap ehome"><div class="edash">'+ring(d.t?d.c/d.t:0,1)+'<div class="edtxt"><div class="l2" style="font-size:14px">Сегодня</div><div class="big num">'+(d.t?Math.round(d.c/d.t*100)+"%":"—")+'</div><div class="l2" style="font-size:14px">'+(d.t?d.c+" попаданий из "+d.t:"попаданий пока нет")+'</div><button class="spill'+(r.offset==null?" risk":"")+'" data-x="rsec" data-v="cal">'+(r.offset==null?"Нужна калибровка":"Поправка "+r.offset+" мс")+"</button></div></div>"+
  '<div class="edgrid">'+RDR.map(([id,n,c,ic,sub])=>{const s=R.stats[id],p=s.t?s.c/s.t:0;return '<button class="edcard" data-x="rsec" data-v="'+id+'" style="--c:'+c+'"><span class="edic">'+ic+'</span><span class="edr">'+miniRing(p,c)+'<b class="num">'+(s.t?Math.round(p*100)+"%":"")+'</b></span><span class="edn">'+n+'</span><span class="eds">'+sub+"</span></button>"}).join("")+"</div></div>"}
function rhHead(id,n,c){return '<div class="ehead" style="--c:'+c+'"><button class="mlback" data-x="rsec" data-v="home">‹ Ритм</button><b class="ehn">'+n+"</b>"+(id!=="cal"&&id!=="poly"?icb('data-x="rset"',IC.gear,"Настройки","sm"):"<span style=\"width:36px\"></span>")+"</div>"}
function rhPad(lab){return '<div class="rmeter"><i class="rzone"></i><i class="rcenter"></i><i id="rmark" class="rmark"></i></div><div id="rdev" class="rdev num">'+(RH.on?"":"&nbsp;")+'</div><button class="rpad'+(RH.on?" live":"")+'" id="rpad" aria-label="Стучи сюда"><span id="rbeat" class="rbeat num"></span><small>'+lab+'</small></button><div class="rprog"><b id="rprog"></b></div>'}
function devSVG(ds,silentMask){const N=ds.length,W=Math.max(200,N*12),H=90,tol=RTOL[RC().level];let s='<svg viewBox="0 0 '+W+" "+H+'" class="devsvg" preserveAspectRatio="none"><rect x="0" y="'+(45-tol/2)+'" width="'+W+'" height="'+tol+'" class="dz"/><line x1="0" y1="45" x2="'+W+'" y2="45" class="dc"/>';
  ds.forEach((v,i)=>{const x=i*W/N+W/N/2;if(silentMask&&silentMask[i])s+='<rect x="'+(i*W/N)+'" y="0" width="'+(W/N)+'" height="'+H+'" class="dsil"/>';if(v==null){s+='<circle cx="'+x+'" cy="45" r="2.5" class="dmiss"/>';return}const y=45+Math.max(-42,Math.min(42,v/2));s+='<circle cx="'+x+'" cy="'+y+'" r="4" class="'+(Math.abs(v)<=tol?"dok":"dbad")+'"/>'});
  return s+"</svg>"}
function rhyHTML(sz){const r=RC(),sec=r.sec;if(sec==="home")return rhHome();
  if(sec==="cal"){const res=RH.res&&RH.res.cal?RH.res:null;return '<div class="ewrap">'+rhHead("cal","Калибровка","#8E8E93")+'<p class="l2" style="font-size:14px;text-align:center;margin:0 10px">Телефон немного запаздывает со звуком и касанием. Постучи ровно в клик 16 раз — приложение запомнит поправку для этого устройства.</p>'+rhPad("стучи вместе с кликом")+
    (res?'<div class="efb '+(res.fail?"bad":"ok")+'" style="text-align:center">'+(res.fail?"Мало попаданий, попробуй ещё раз":"Готово: поправка <b>"+res.off+" мс</b>")+"</div>":"")+'<button class="btn fill block" data-x="rstart">'+(RH.on?"Идёт…":res?"Ещё раз":"Начать")+"</button></div>"}
  const dr=RDR.find(d=>d[0]===sec);if(!dr){r.sec="home";return rhHome()}const head=rhHead(sec,dr[1],dr[2]),lvl={easy:"лёгкий",mid:"средний",hard:"сложный"}[r.level];
  if(sec==="acc"||sec==="gap"){const res=RH.res&&!RH.res.cal&&RH.mode===sec?RH.res:null,info=r.bpm+" bpm · "+(sec==="acc"?(r.sub===2?"восьмые":"четверти")+" · "+r.len+" долей":"2 такта с кликом, 2 без")+" · "+lvl;
    return '<div class="ewrap rw" style="--c:'+dr[2]+'">'+head+(res?'<div class="tiles num"><div class="tile"><b>'+res.pct+'%</b><span>в долю</span></div><div class="tile"><b>'+(res.mean>0?"+":"")+res.mean+'</b><span>мс, '+(res.mean>0?"поздно":"рано")+'</span></div><div class="tile"><b>'+(sec==="gap"&&res.drift!=null?(res.drift>0?"+":"")+res.drift:res.sd)+'</b><span>'+(sec==="gap"?"мс уход в тишине":"мс разброс")+'</span></div></div><div class="card" style="margin-top:0">'+devSVG(res.ds,sec==="gap"?RH.exp.map(e=>e.silent):null)+'<p class="l2" style="font-size:12px;margin:6px 0 0">Каждая точка — доля: выше центра поздно, ниже рано. Зелёная полоса — допуск.'+(res.missed?" Пропущено: "+res.missed+".":"")+"</p></div>":rhPad(info))+
      '<button class="btn fill block" data-x="rstart">'+(RH.on?"Стоп":res?"Ещё раз":"Старт")+"</button></div>"}
  if(sec==="pat"){if(!RH.pat)patGen();const res=RH.step==="done"?RH.res:null;
    return '<div class="ewrap rw" style="--c:'+dr[2]+'">'+head+'<div class="ecard" style="--c:'+dr[2]+'"><div class="eq1">'+(RH.step==="rec"?"Стучи!":RH.step==="listen"?"Слушай":res?res.score+"%":"Повтори ритм")+'</div><div class="eq2">'+r.bpm+" bpm · "+RH.pat.beats/4+" "+plural(RH.pat.beats/4,["такт","такта","тактов"])+" · "+lvl+'</div><div class="patwrap">'+patSVG()+'</div>'+(res?'<div class="efb '+(res.score>=80?"ok":"bad")+'">Попал в '+res.marks.filter(Boolean).length+" из "+res.marks.length+(res.extra>0?", лишних ударов: "+res.extra:"")+"</div>":'<div class="efb">Сначала послушай, потом отстучи после 4 щелчков отсчёта</div>')+"</div>"+
      (RH.step==="rec"?'<button class="rpad live" id="rpad" aria-label="Стучи сюда"><span id="rbeat" class="rbeat num"></span><small>стучи ритм</small></button><div class="rprog"><b id="rprog"></b></div>':'<div class="ebtns"><button class="btn ebtn" data-x="rplay">Послушать</button><button class="bigplay" data-x="rrec" aria-label="Отстучать">'+'<svg viewBox="0 0 24 24" class="f"><circle cx="12" cy="12" r="6"/></svg>'+'</button><button class="btn ebtn" data-x="rnew">Новый</button></div>')+"</div>"}
  if(sec==="tempo"){const q=RH.tq,done=q&&q.done,err=done?Math.round((RH.guess-q.bpm)/q.bpm*100):0;
    return '<div class="ewrap rw" style="--c:'+dr[2]+'">'+head+'<div class="ecard" style="--c:'+dr[2]+'"><button class="eplay" id="eplay" data-x="tq" style="--c:'+dr[2]+'" aria-label="Послушать темп">'+PLAY+'<i></i><i></i></button><div class="eq1">Какой темп?</div><div class="eq2">8 щелчков · допуск '+Math.round(RTEMPO[r.level]*100)+"%</div>"+(done?'<div class="efb '+(Math.abs(err)<=RTEMPO[r.level]*100?"ok":"bad")+'">Было <b>'+q.bpm+" bpm</b>, ты сказал "+RH.guess+" ("+(err>0?"+":"")+err+"%)</div>":'<div class="efb"></div>')+"</div>"+
      '<div class="tguess"><div class="bpmrow">'+icb('data-hold="-1" data-tg="1"',IC.minus,"Меньше","round")+'<div class="bpm num" id="tgv">'+RH.guess+'</div>'+icb('data-hold="1" data-tg="1"',IC.plus,"Больше","round")+'</div><input type="range" class="range" id="tgr" min="40" max="220" value="'+RH.guess+'" aria-label="Твой ответ, bpm"></div>'+
      '<button class="btn fill block" data-x="'+(done||!q?"tq":"tans")+'">'+(!q?"Послушать":done?"Следующий":"Ответить")+"</button></div>"}
  if(sec==="poly"){const[a,b]=r.poly.split(":").map(Number);
    return '<div class="ewrap rw" style="--c:'+dr[2]+'">'+head+'<div class="hscroll" style="justify-content:center">'+POLYS.map(p=>'<button class="pill" data-x="rpoly" data-v="'+p+'" aria-pressed="'+(r.poly===p)+'">'+p+"</button>").join("")+'</div><div class="polywrap">'+polySVG()+'</div><div class="vrow"><button class="lchip'+(r.mute.a?" off":"")+'" data-x="rmute" data-v="a" style="--c:var(--tint);--t:var(--on-tint)">Внешний: '+a+'</button><button class="lchip'+(r.mute.b?" off":"")+'" data-x="rmute" data-v="b" style="--c:#00C7BE;--t:#fff">Внутренний: '+b+"</button></div>"+
      '<div class="bpmrow">'+icb('data-x="rpb" data-d="-5"',IC.minus,"Медленнее","round")+'<div class="bpmbox"><div class="bpm num">'+r.pbpm+'</div><div class="bpmlbl">bpm внутреннего ряда</div></div>'+icb('data-x="rpb" data-d="5"',IC.plus,"Быстрее","round")+'</div><button class="btn fill block" data-x="rpolyplay">'+(RH.on&&RH.mode==="poly"?"Стоп":"Старт")+"</button></div>"}
  return ""}
function rhSettings(){const r=RC();const body=()=>'<div class="snav"><span></span><div class="t">Настройки ритма</div><button class="link b r" data-close>Готово</button></div>'+
  '<div class="hdr" style="margin-top:4px">Темп</div><div class="group"><div class="cell"><span class="grow num" style="font-size:22px;font-weight:300">'+r.bpm+' bpm</span><span class="stepper"><button data-bp="-5">−</button><button data-bp="5">+</button></span></div></div>'+
  '<div class="hdr">Сложность</div><div class="group"><div class="cellcol"><div class="seg">'+[["easy","Лёгкий"],["mid","Средний"],["hard","Сложный"]].map(([k,n])=>'<button data-lv="'+k+'" aria-pressed="'+(r.level===k)+'">'+n+"</button>").join("")+'</div></div></div><p class="ftr">Допуск попадания: 45, 30 или 18 мс.</p>'+
  (r.sec==="acc"?'<div class="hdr">Длина и доли</div><div class="group"><div class="cellcol"><div class="seg">'+[8,16,32].map(n=>'<button data-ln="'+n+'" aria-pressed="'+(r.len===n)+'">'+n+" долей</button>").join("")+'</div></div><div class="cellcol"><div class="seg">'+[[1,"Четверти"],[2,"Восьмые"]].map(([k,n])=>'<button data-sb="'+k+'" aria-pressed="'+(r.sub===k)+'">'+n+"</button>").join("")+"</div></div></div>":"")+
  '<div class="group" style="margin-top:14px"><button class="cell act" data-cal>Калибровка задержки'+(r.offset!=null?" ("+r.offset+" мс)":"")+"</button></div>";
  openSubSheet(body(),sc=>{const sh=sc.querySelector(".sheet");sc.addEventListener("click",e=>{const g=s=>e.target.closest(s);let b;
    if(b=g("[data-bp]"))r.bpm=Math.max(40,Math.min(220,r.bpm+ +b.dataset.bp));else if(b=g("[data-lv]"))r.level=b.dataset.lv;else if(b=g("[data-ln]"))r.len=+b.dataset.ln;else if(b=g("[data-sb]"))r.sub=+b.dataset.sb;
    else if(g("[data-cal]")){$("#sheetLayer").innerHTML="";rhStop();r.sec="cal";RH.res=null;saveT();refreshIf("rhy");return}else return;
    if(r.sec==="pat")RH.pat=null;saveT();sh.innerHTML='<div class="grab"></div>'+body();refreshIf("rhy")})})}
document.addEventListener("input",e=>{if(e.target.id==="tgr"){RH.guess=+e.target.value;const v=$("#tgv");if(v)v.textContent=RH.guess}});

/* ---------- feature toggles ---------- */
const FEAT=[["metro","Метроном"],["tuner","Тюнер"],["piano","Пианино"],["drone","Дрон и пэды"],["theory","Теория"],["ear","Слух"],["timer","Помодоро"],["audio","Медиатека и аудио"],["notes","Табы и текст в сессии"],["streak","Ударный режим"]];
const isOn=id=>!((S.settings.off||{})[id]);
function featHTML(){return '<div class="large">Функции</div><p class="sub" style="margin:0 4px 12px">Выключи то, чем не пользуешься, — оно пропадёт из инструментов и сессий. Данные при этом сохраняются.</p>'+
  '<div class="group">'+FEAT.map(([k,n])=>'<div class="cell">'+(TICON[k]?'<span class="ticon" style="background:'+((TOOLS.find(t=>t[0]===k)||[])[3]||"#8E8E93")+'">'+TICON[k]+"</span>":k==="streak"?'<span class="ticon" style="background:#FF9500">'+FLAME+"</span>":'<span class="ticon" style="background:#8E8E93">'+IC.notes+"</span>")+'<span class="grow">'+n+'</span><label class="sw"><input type="checkbox" data-feat="'+k+'"'+(isOn(k)?" checked":"")+' aria-label="'+n+'"><i></i></label></div>').join("")+"</div>"}
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.feat;if(!k)return;const off=S.settings.off||(S.settings.off={});if(e.target.checked)delete off[k];else off[k]=true;S.settings.updatedAt=Date.now();save();render()});
/* ---------- home v3 («Сегодня») with customizable quick access ---------- */
const QDEF=["metro","tuner","ear","piano"];
function quickList(){const q=(S.settings.quick||QDEF).filter(id=>isOn(id)&&TOOLS.some(t=>t[0]===id));return q}
function homeHTML(){const w=weekData(),goal=S.settings.goalMin*60,p=goal?w.total/goal:0,today=(new Date().getDay()+6)%7,plan=S.settings.days;
  let h=topbar()+'<div class="large">Сегодня</div><div class="hcols"><div>';
  h+='<div class="hcard"><div class="hrow">'+ring(p,1)+'<div class="htxt"><div class="l2" style="font-size:14px">Эта неделя</div><div class="big num">'+fmtDur(w.total)+'</div><div class="l2" style="font-size:14px">из '+fmtDur(goal)+(p>1?", перевыполнено":p>=1?", цель выполнена":"")+"</div>"+streakPill()+"</div></div>"+
    '<div class="days hdays">'+WD.map((d,i)=>'<div class="day '+(w.per[i]>0?"done":plan[i]?"plan":"rest")+(i===today?" today":"")+'" title="'+(w.per[i]?fmtDur(w.per[i]):plan[i]?"день практики":"отдых")+'"><span class="d"></span>'+d+"</div>").join("")+"</div>"+
    '<button class="hlink" data-pp="'+(S.settings.configured?"stats":"week")+'">'+(S.settings.configured?(plan[today]?"Сегодня день практики":"Сегодня по плану отдых")+" · статистика":"Настроить дни и цель")+" ›</button></div>";
  h+='<button class="hcta" data-act="free">'+PLAY+"<span>"+(A?"Вернуться к сессии":"Начать практику")+"</span></button>";
  const q=quickList();
  h+='<div class="hhdr"><span>Быстрый доступ</span><button class="link" data-act="quickedit">Изменить</button></div>';
  h+='<div class="qgrid">'+(q.length?q.map(id=>{const t=TOOLS.find(x=>x[0]===id);return '<button class="qbtn" data-open-tool="'+id+'" style="--c:'+t[3]+'"><span class="qic">'+TICON[id]+'</span><span class="qn">'+t[1]+"</span></button>"}).join(""):'<button class="qbtn add" data-act="quickedit"><span class="qic">'+IC.plus+'</span><span class="qn">Добавить</span></button>')+"</div>";
  h+="</div><div>";
  const rec=songs().map(s=>({s,st:songStats(s.id)})).sort((a,b)=>(b.st.last||b.s.createdAt)-(a.st.last||a.s.createdAt)).slice(0,4);
  h+='<div class="hhdr"><span>Продолжить</span>'+(songs().length>4?'<button class="link" data-tab="library">Все песни</button>':"")+"</div>";
  if(!rec.length)h+='<div class="group"><button class="cell act" data-act="addSong">Добавить первую песню</button></div>';
  else h+='<div class="slist">'+rec.map(({s,st})=>{const g=genreOf(s.genre),sub=s.currentBpm&&s.targetBpm?s.currentBpm+" → "+s.targetBpm+" bpm":st.last?relDay(st.last)+", "+fmtDur(st.total):"ещё не играл";
    return '<div class="stile3 hsong" style="--g:'+(g?g.color:"var(--l3)")+'"><button class="grow" data-song="'+s.id+'" style="text-align:left;min-width:0"><div class="ttl">'+esc(s.title)+'</div><div class="st">'+esc(sub)+'</div></button><button class="playmini2" aria-label="Начать сессию: '+esc(s.title)+'" data-play="'+s.id+'">'+PLAY+"</button></div>"}).join("")+"</div>";
  return h+"</div></div>"}
function quickEdit(){if(needPro("Свой главный экран"))return;const sel=()=>(S.settings.quick||QDEF).slice();
  const body=()=>{const q=sel().filter(id=>isOn(id)),rest=TOOLS.map(t=>t[0]).filter(id=>isOn(id)&&!q.includes(id));
    const row=(id,on,i)=>{const t=TOOLS.find(x=>x[0]===id);return '<div class="cell"><span class="ticon" style="background:'+t[3]+'">'+TICON[id]+'</span><span class="grow">'+t[1]+"</span>"+(on?(i>0?'<button class="ic sm plain" data-qu="'+id+'" aria-label="Выше">'+'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>'+"</button>":"")+'<button class="ic sm plain" data-qr="'+id+'" aria-label="Убрать" style="color:var(--red)">'+IC.minus+"</button>":'<button class="ic sm plain" data-qa="'+id+'" aria-label="Добавить" style="color:#34C759">'+IC.plus+"</button>")+"</div>"};
    return '<div class="snav"><span></span><div class="t">Быстрый доступ</div><button class="link b r" data-close>Готово</button></div><div class="hdr" style="margin-top:4px">На главной · '+q.length+' из 8</div><div class="group">'+(q.length?q.map((id,i)=>row(id,true,i)).join(""):'<div class="cell l2">Пусто</div>')+"</div>"+
      (rest.length?'<div class="hdr">Можно добавить</div><div class="group">'+rest.map(id=>row(id,false)).join("")+"</div>":"")+'<p class="ftr">Порядок меняется стрелкой. Выключенные в «Функциях» инструменты здесь не показываются.</p>'};
  openSubSheet(body(),sc=>{const sh=sc.querySelector(".sheet");sc.addEventListener("click",e=>{const g=s=>e.target.closest(s);let b,q=sel();
    if(b=g("[data-qa]")){if(q.length>=8){toast("Не больше 8");return}q.push(b.dataset.qa)}else if(b=g("[data-qr]"))q=q.filter(x=>x!==b.dataset.qr);
    else if(b=g("[data-qu]")){const i=q.indexOf(b.dataset.qu);if(i>0){[q[i-1],q[i]]=[q[i],q[i-1]]}}else return;
    S.settings.quick=q;S.settings.updatedAt=Date.now();save();sh.innerHTML='<div class="grab"></div>'+body();render()})})}

/* ---------- tuner v3: clean view, styles, settings ---------- */
const TTOL={strict:[2,"Строгий","±2 цента — для записи и сцены"],normal:[5,"Обычный","±5 центов — повседневная настройка"],soft:[10,"Мягкий","±10 центов — для новичков, засчитывает раньше"]};
const TSTY=[["needle","Стрелка"],["strobe","Стробоскоп"],["bar","Полоса"],["ring","Кольцо"]];
function TUC(){const t=T.tuner;if(t.useTuning==null)t.useTuning=false;if(!t.tol)t.tol="normal";if(!t.style)t.style="needle";if(t.showStrings==null)t.showStrings=true;if(t.head==null)t.head=false;return t}

const tStyle=()=>{const s=TUC().style;return s!=="needle"&&!isPro()?"needle":s};

function headHTML(tn){const n=tn.names.length,L=Math.ceil(n/2),W=200,H=150;let s='<svg viewBox="0 0 '+W+" "+H+'" class="thead" aria-hidden="true"><path d="M70 150 L62 20 Q100 0 138 20 L130 150 Z" class="hsk"/>';

let LNG="ru",LI=-1,FRX=null,FRM=null,TRB=false;
function langCode(){const l=S.settings.lang;if(l)return l;const n=((navigator.languages&&navigator.languages[0])||navigator.language||"ru").toLowerCase();return n.startsWith("uz")?"uz":n.startsWith("en")?"en":"ru"}
const CYR=/[А-Яа-яЁё]/;
function trStr(s){if(!s||!CYR.test(s))return s;const t=s.trim(),hit=I18N[t];if(hit)return s.replace(t,hit[LI]);
  let r=s.replace(FRX,(m,a,b)=>a+(FRM[b]!=null?FRM[b]:b));
  const U=LI===0?{min:"min",h:"h",s:"s",d:["day","days"],w:["week","weeks"]}:{min:"daq",h:"soat",s:"s",d:["kun","kun"],w:["hafta","hafta"]};
  r=r.replace(/(\d)\s?мин(?![А-Яа-яЁё])/g,"$1 "+U.min).replace(/(\d)\s?ч(?![А-Яа-яЁё])/g,"$1 "+U.h).replace(/(\d)\s?с(?![А-Яа-яЁё])/g,"$1 "+U.s).replace(/(\d+)\s(день|дня|дней)/g,(m,n)=>n+" "+U.d[n==1?0:1]).replace(/(\d+)\s(неделя|недели|недель)/g,(m,n)=>n+" "+U.w[n==1?0:1]).replace(/(\d+)\s(ответ|ответа|ответов)/g,"$1 "+(LI===0?"answers":"javob")).replace(/(\d+)\s(песня|песни|песен)/g,"$1 "+(LI===0?"songs":"qoʻshiq")).replace(/(\d+)\s(файл|файла|файлов)/g,"$1 "+(LI===0?"files":"fayl")).replace(/(^|\s)из\s/g,(m,a)=>a+(LI===0?"of ":"/ ")).replace(/(\d)\s?Гц/g,"$1 "+(LI===0?"Hz":"Gs")).replace(/(\d)\s?мс(?![А-Яа-яЁё])/g,"$1 ms").replace(/(\d)\s?МБ/g,"$1 MB");
  return r}
function trText(n){if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest("script,style,textarea,.uc,.legal,[contenteditable]"))return;const v=n.nodeValue,r=trStr(v);if(r!==v)n.nodeValue=r}
function trAttrs(el){if(!el.getAttribute)return;["aria-label","placeholder","title"].forEach(a=>{const v=el.getAttribute(a);if(v&&CYR.test(v)){const r=trStr(v);if(r!==v)el.setAttribute(a,r)}})}
function trNode(root){if(!root)return;if(root.nodeType===3){trText(root);return}if(root.nodeType!==1)return;if(root.closest&&root.closest("script,style,.uc,.legal"))return;trAttrs(root);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;while(n=w.nextNode()){if(n.nodeType===3)trText(n);else trAttrs(n)}}
function i18nInit(){LNG=langCode();document.documentElement.lang=LNG;if(LNG==="ru")return;LI=LNG==="en"?0:1;
  const keys=Object.keys(I18N).filter(k=>k.length>=4&&CYR.test(k)).sort((a,b)=>b.length-a.length);FRM={};keys.forEach(k=>FRM[k]=I18N[k][LI]);
  FRX=new RegExp("(^|[^А-Яа-яЁё])("+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?=$|[^А-Яа-яЁё])","g");
  trNode(document.body);
  new MutationObserver(ms=>{if(TRB)return;TRB=true;try{ms.forEach(m=>{if(m.type==="characterData")trText(m.target);else if(m.type==="attributes")trAttrs(m.target);else m.addedNodes.forEach(trNode)})}finally{TRB=false}}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["aria-label","placeholder","title"]})}
setTimeout(i18nInit,0);

  const n=performance.now();if(n-lastUi>200){lastUi=n;uiTick()}
  raf=requestAnimationFrame(loop)}
function uiTick(){flipTick();vinylTick();const mp=$("#mlprog");if(mp&&AU.cur&&AU.el.duration)mp.style.width=(AU.el.currentTime/AU.el.duration*100)+"%";const pcp=$("#pchip");if(pcp){const nh=pchipHTML();if(pcp.dataset.h!==nh){pcp.dataset.h=nh;pcp.innerHTML=nh}}const pt=$("#ptime");if(pt){const tot=PO.mins(PO.phase)*60,rem=PO.rem();pt.textContent=fmtClock(rem);const arc=$("#parc"),C=2*Math.PI*98;if(arc)arc.setAttribute("stroke-dasharray",(C*(1-rem/tot))+" "+C)}
  const pm=$("#pomoMini");if(pm)pm.textContent=(PO.running||PO.left!=null)?"Помодоро: "+PHASE[PO.phase].toLowerCase()+", "+fmtClock(PO.rem())+(PO.running?"":" (пауза)"):"";
  const wh=$("#wfhead");if(wh&&AU.cur&&AU.el.duration){const fr=AU.el.currentTime/AU.el.duration;wh.style.left=(fr*100)+"%";const cl=$("#wfclip");if(cl)cl.setAttribute("width",fr*((AU.cur.peaks||[]).length||120))}const as=$("#aseek");if(as&&AU.cur){if(document.activeElement!==as){as.max=AU.el.duration||1;as.value=AU.el.currentTime}const c1=$("#acur");if(c1)c1.textContent=fmtT(AU.el.currentTime);const c2=$("#adur");if(c2)c2.textContent=fmtT(AU.el.duration)}
  const ap=$("#aplay");if(ap){const w=AU.el.paused?"p":"s";if(ap.dataset.st!==w){ap.dataset.st=w;ap.innerHTML=AU.el.paused?PLAY:PAUSE}}}
const PRESETS=[[2,4],[3,4],[4,4],[5,4],[6,8],[7,8],[9,8],[12,8],[5,8],[7,4],[2,2],[3,8]];
function meterSheet(){const c=M.cfg;let num=c.num,den=c.den;
  const body=()=>'<div class="snav"><button class="link l" data-close>Отмена</button><div class="t">Размер</div><button class="link b r" id="ok">Готово</button></div>'+
    '<div style="text-align:center;font-size:56px;font-weight:300;letter-spacing:-.03em;margin:4px 0 8px" class="num" id="mview">'+num+"/"+den+"</div>"+
    '<div class="group"><div class="cell"><span class="grow">Долей в такте</span><span class="val num" style="color:var(--ink);margin-right:6px" id="nv">'+num+"</span>"+stepper("num","Долей в такте")+"</div>"+
    '<div class="cellcol"><div style="margin-bottom:8px">Длительность доли</div>'+seg("den",[[2,"1/2"],[4,"1/4"],[8,"1/8"],[16,"1/16"]],den)+"</div></div>"+
    '<div class="hdr">Частые размеры</div><div class="group"><div class="cellcol" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">'+PRESETS.map(([n,d])=>'<button class="pill num" data-pre="'+n+"/"+d+'" aria-pressed="'+(n===num&&d===den)+'">'+n+"/"+d+"</button>").join("")+"</div></div>"+
    '<p class="ftr">Для размеров на восьмые темп считается в восьмых. Акценты расставятся по группам (например, 7/8 как 2+2+3), их можно поменять нажатием на долю.</p>';
  openSubSheet(body(),sc=>{const ref=()=>{sc.querySelector("#mview").textContent=num+"/"+den;sc.querySelector("#nv").textContent=num;
      sc.querySelectorAll("[data-pre]").forEach(p=>p.setAttribute("aria-pressed",p.dataset.pre===num+"/"+den));sc.querySelectorAll('[data-seg="den"] button').forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===den))};
    sc.addEventListener("click",e=>{const st=e.target.closest("[data-step]");if(st){num=Math.max(1,Math.min(16,num+ +st.dataset.d));ref();return}
      const sg=e.target.closest('[data-seg="den"] [data-v]');if(sg){den=+sg.dataset.v;ref();return}
      const pr=e.target.closest("[data-pre]");if(pr){[num,den]=pr.dataset.pre.split("/").map(Number);ref();return}
      if(e.target.closest("#ok")){c.num=num;c.den=den;c.accents=defaultAccents(num,den);M.beat=0;M.subI=0;saveMetro();$("#sheetLayer").innerHTML="";renderHost()}})})}
function moreSheet(){const c=M.cfg;
  const body=()=>'<div class="snav"><span></span><div class="t">Метроном</div><button class="link b r" data-close>Готово</button></div>'+
    '<div class="hdr" style="margin-top:4px">Регулировка темпа</div><div class="group"><div class="cellcol"><div class="seg" role="group">'+[["wheel","Колесо"],["arrows","Стрелки"],["both","Колесо и стрелки"]].map(([v,l])=>'<button data-adj="'+v+'" aria-pressed="'+(adjMode()===v)+'">'+l+"</button>").join("")+'</div></div></div><p class="ftr">Число темпа можно нажать и ввести с клавиатуры.</p>'+
    '<div class="hdr">Звук</div><div class="group"><div class="cellcol">'+seg("sound",[["click","Клик"],["wood","Дерево"],["beep","Бип"]],c.sound)+"</div></div>"+
    '<div class="hdr">Дробление</div><div class="group"><div class="cellcol">'+seg("sub2",[[1,"Нет"],[2,"Восьмые"],[3,"Триоли"],[4,"Шестн."]],c.sub)+"</div>"+
    (c.sub===2?'<div class="cell"><span class="grow">Свинг</span>'+sw("swing",c.swing,"Свинг")+"</div>":"")+"</div>"+
    '<div class="hdr">Постепенное ускорение</div><div class="group"><div class="cell"><span class="grow">Включить</span>'+sw("tr",c.trainer.on,"Постепенное ускорение")+"</div>"+
    (c.trainer.on?'<div class="cell"><span class="grow">Прибавлять</span><span class="val num" style="color:var(--ink);margin-right:6px">+'+c.trainer.step+" bpm</span>"+stepper("tstep","Шаг")+"</div>"+
      '<div class="cell"><span class="grow">Каждые</span><span class="val num" style="color:var(--ink);margin-right:6px">'+c.trainer.every+" "+plural(c.trainer.every,["такт","такта","тактов"])+"</span>"+stepper("tevery","Тактов")+"</div>"+
      '<div class="cell"><span class="grow">До темпа</span><span class="val num" style="color:var(--ink);margin-right:6px">'+c.trainer.max+" bpm</span>"+stepper("tmax","Предел")+"</div>":"")+"</div>"+
    '<p class="ftr">Темп растёт сам, пока не дойдёт до предела.</p>'+
    '<div class="hdr">Тихие такты</div><div class="group"><div class="cell"><span class="grow">Включить</span>'+sw("gap",c.gap.on,"Тихие такты")+"</div>"+
    (c.gap.on?'<div class="cell"><span class="grow">Со звуком</span><span class="val num" style="color:var(--ink);margin-right:6px">'+c.gap.play+"</span>"+stepper("gplay","Тактов со звуком")+"</div>"+
      '<div class="cell"><span class="grow">Без звука</span><span class="val num" style="color:var(--ink);margin-right:6px">'+c.gap.mute+"</span>"+stepper("gmute","Тактов без звука")+"</div>":"")+"</div>"+
    '<p class="ftr">Метроном замолкает на несколько тактов: так проверяется, держишь ли ты темп сам.</p>'+
    '<div class="group" style="margin-top:24px"><button class="cell act center" id="rst">Сбросить акценты</button></div>';
  openSubSheet(body(),sc=>{const sheet=sc.querySelector(".sheet");const re=()=>{const y=sheet.scrollTop;sheet.innerHTML='<div class="grab"></div>'+body();sheet.scrollTop=y};
    const lim={tstep:[1,20,"trainer","step"],tevery:[1,32,"trainer","every"],tmax:[30,300,"trainer","max"],gplay:[1,16,"gap","play"],gmute:[1,16,"gap","mute"]};
    sc.addEventListener("click",e=>{const aj=e.target.closest("[data-adj]");if(aj){if(aj.dataset.adj!=="wheel"&&needPro("Вид инструментов"))return;S.settings.metroAdj=aj.dataset.adj;S.settings.updatedAt=Date.now();save();re();renderHost();return}const sg=e.target.closest("[data-seg] [data-v]");
      if(sg){const k=sg.closest("[data-seg]").dataset.seg;if(k==="sound")c.sound=sg.dataset.v;else{c.sub=+sg.dataset.v;M.subI=0}saveMetro();re();renderHost();return}
      const st=e.target.closest("[data-step]");if(st){const[lo,hi,o,f]=lim[st.dataset.step];const d=+st.dataset.d*(st.dataset.step==="tmax"?5:1);c[o][f]=Math.max(lo,Math.min(hi,c[o][f]+d));saveMetro();re();renderHost();return}
      if(e.target.closest("#rst")){c.accents=defaultAccents(c.num,c.den);saveMetro();renderHost();toast("Акценты сброшены")}});
    sc.addEventListener("change",e=>{const k=e.target.dataset.sw;if(!k)return;if(k==="swing")c.swing=e.target.checked;if(k==="tr"){c.trainer.on=e.target.checked;if(c.trainer.max<=c.bpm)c.trainer.max=Math.min(300,c.bpm+20)}if(k==="gap")c.gap.on=e.target.checked;saveMetro();re();renderHost()})})}
function hideSession(){sessionOpen=false;const s=$(".session");if(s)s.classList.remove("rot");clearInterval(tickT);$("#layer").innerHTML="";render()}
function checkIdle(){if(!A||A.asked||M.running||A.pausedAt)return;if(Date.now()-A.last>45*60000){A.asked=true;saveActive();
  const d=document.createElement("div");d.className="ask";d.innerHTML='<div class="alert" role="alertdialog" aria-label="Проверка активности"><div class="ab"><h3>Ты ещё играешь?</h3><p>Ничего не нажималось 45 минут.</p></div><div class="abtns"><button data-k="end">Завершить</button><button data-k="go">Да, играю</button></div></div>';
  document.body.appendChild(d);d.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(!k)return;d.remove();if(k.dataset.k==="go"){A.last=Date.now();A.asked=false;saveActive()}else finish(A.last)})}}
function finish(endAt){if(M.running){M.stop();const mb=$("#mbtn");if(mb)mb.innerHTML=PLAY}tickBpm();
  let dur=elapsed();if(endAt)dur=Math.max(0,(endAt-A.startedAt-A.pausedTotal)/1000);
  const song=A.songId?songById(A.songId):null;
  let best=null;Object.entries(A.bpmTime||{}).forEach(([k,v])=>{if(v>=15&&(!best||+k>best))best=+k});
  if(dur<60){openSubSheet('<div class="snav"><span></span><div class="t">Короткая сессия</div><span></span></div><p style="text-align:center;margin:8px 8px 20px" class="l2">Сессии короче минуты не попадают в статистику.</p><button class="btn fill block" data-k="back">Продолжить играть</button><button class="btn block" data-k="drop" style="margin-top:10px;color:var(--red)">Удалить сессию</button>',
    sc=>sc.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(!k)return;$("#sheetLayer").innerHTML="";if(k.dataset.k==="drop"){A=null;saveActive();releaseWake();hideSession()}}));return}
  let tag="",readM=null;
  openSubSheet('<div class="snav"><button class="link l" data-k="back">Назад</button><div class="t">Сессия завершена</div><button class="link b r" data-k="save">Сохранить</button></div>'+
    '<div style="text-align:center;margin:4px 0 18px"><div class="num" style="font-size:44px;font-weight:300;letter-spacing:-.03em">'+fmtDur(dur)+'</div><div class="l2" style="font-size:15px">'+(song?esc(song.title):A.type==="tool"?esc(toolName(A.tool)):"Свободная практика")+(best?", до "+best+" bpm":"")+"</div></div>"+
    (song?'<div class="hdr">Как сейчас с песней</div><div class="group"><div class="cellcol">'+mInput(getPct(song))+'</div><label class="cell"><span class="grow">Уверенный темп</span><input class="inp num" id="cb" type="number" inputmode="numeric" min="20" max="300" placeholder="bpm" value="'+(best||song.currentBpm||"")+'"></label></div>'
      :A.type==="tool"?"":'<div class="hdr">Что играл</div><div class="group"><div class="cellcol"><div class="hscroll" style="padding:0;flex-wrap:wrap" id="tg">'+TAGS.map(t=>'<button type="button" class="pill" aria-pressed="false" data-t="'+t+'">'+t+"</button>").join("")+"</div></div></div>")+
    '<div class="hdr">Заметка</div><div class="group"><textarea class="ta" id="nt" style="min-height:80px;font-family:var(--font);font-size:16px" placeholder="Что получилось, что нет"></textarea></div>',
    sc=>{if(song)readM=bindM(sc);sc.addEventListener("click",e=>{
      const t=e.target.closest("[data-t]");if(t){tag=tag===t.dataset.t?"":t.dataset.t;sc.querySelectorAll("[data-t]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.t===tag));return}
      const k=e.target.closest("[data-k]");if(!k)return;
      if(k.dataset.k==="back"){$("#sheetLayer").innerHTML="";return}
      const now=Date.now();const rec={id:A.id,type:A.type,songId:A.songId,tool:A.tool||null,start:A.startedAt,end:endAt||now,dur:Math.round(dur),bpm:best,tag:tag||null,note:sc.querySelector("#nt").value.trim()||null,updatedAt:now};
      if(song){const cb=parseInt((sc.querySelector("#cb")||{}).value,10);song.masteryPct=readM();song.mastery=Math.max(1,Math.round(song.masteryPct/20));if(cb>0){song.currentBpm=cb;rec.bpm=rec.bpm||cb}
        song.metro={num:M.cfg.num,den:M.cfg.den,sub:M.cfg.sub,swing:M.cfg.swing,sound:M.cfg.sound,accents:M.cfg.accents.slice(),bpm:M.cfg.bpm,trainer:Object.assign({},M.cfg.trainer),gap:Object.assign({},M.cfg.gap)};song.updatedAt=now}
      S.sessions.push(rec);A=null;PO.reset();saveActive();releaseWake();M.cfg=S.settings.metro;save();$("#sheetLayer").innerHTML="";hideSession();toast("Сохранено: "+fmtDur(rec.dur))})})}

/* ---------- global events ---------- */
document.addEventListener("click",e=>{if(e.target.closest("#layer,#sheetLayer,#tvLayer,.ask,.toolhost"))return;
  const sg=e.target.closest('[data-seg="theme"] [data-v]');if(sg){S.settings.theme=sg.dataset.v;S.settings.updatedAt=Date.now();applyTheme();save();render();return}
  const sc=e.target.closest('[data-seg="scale"] [data-v]');if(sc){S.settings.scale=sc.dataset.v;S.settings.updatedAt=Date.now();save();render();return}
  const t=e.target.closest("button,[data-song]");if(!t)return;const d=t.dataset;
  if(d.tab)go(d.tab);
  else if(d.go)go(d.go);
  else if(d.play){stab=null;startSession("song",d.play)}
  else if(d.song)go("library",d.song);
  else if(d.genre!==undefined){view.genre=d.genre;render()}
  else if(d.edit)songForm(d.edit);
  else if(d.del){const s=songById(d.del);confirmAlert("Удалить «"+s.title+"»?","Время её сессий останется в общей статистике.","Удалить",()=>{s.deleted=true;s.updatedAt=Date.now();save();go("library")})}
  else if(d.day){S.settings.days[+d.day]=S.settings.days[+d.day]?0:1;S.settings.configured=true;S.settings.updatedAt=Date.now();save();render()}
  else if(d.goal){S.settings.goalMin=Math.max(30,Math.min(3000,S.settings.goalMin+ +d.goal));S.settings.configured=true;S.settings.updatedAt=Date.now();save();render()}
  else if(d.act==="panel")openPanel("root");
  else if(d.act==="libman")libManager();
  else if(d.act==="quickedit")quickEdit();
  else if(d.act==="donate")donateSheet();
  else if(d.act==="legal")legalSheet(d.v);
  else if(d.cat!==undefined){view.cat=d.cat;view.genre="";view.tag="";render()}
  else if(d.fg!==undefined){view.genre=view.genre===d.fg?"":d.fg;render()}
  else if(d.ft!==undefined){view.tag=view.tag===d.ft?"":d.ft;render()}
  else if(d.fclear!==undefined){view.genre="";view.tag="";render()}
  else if(d.act==="streak")streakSheet();
  else if(d.act==="pclose")closePanel();
  else if(d.pp){if(!panel)openPanel(d.pp);else{panel=d.pp;renderPanel();$("#panelLayer").scrollTop=0}}
  else if(d.openTool)openToolView(d.openTool);
  else if(d.act==="freeWith"){stab=null;startSession("tool",null,d.with)}
  else if(d.act==="free")startSession("free");
  else if(d.act==="addSong")songForm();
  else if(d.act==="export")doExport();
  else if(d.act==="import")$("#importFile").click();
  else if(d.act==="reset")confirmAlert("Удалить все данные?","Песни, сессии и настройки исчезнут без возможности восстановления.","Удалить",()=>{const keep=S.settings.theme;S=blank();S.settings.theme=keep;M.cfg=S.settings.metro;save();render();toast("Данные удалены")})});
function confirmAlert(title,text,yes,fn){const d=document.createElement("div");d.className="ask";d.innerHTML='<div class="alert" role="alertdialog"><div class="ab"><h3>'+esc(title)+"</h3><p>"+esc(text)+'</p></div><div class="abtns"><button data-k="no">Отмена</button><button data-k="yes" style="color:var(--red)">'+esc(yes)+"</button></div></div>";
  document.body.appendChild(d);d.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(!k&&e.target!==d)return;d.remove();if(k&&k.dataset.k==="yes")fn()})}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.input;if(!k)return;view[k]=e.target.value;
  if(k==="q"){const pos=e.target.selectionStart;render();const s=document.querySelector('[data-input="q"]');if(s){s.focus();try{s.setSelectionRange(pos,pos)}catch(_){}}}else render()});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.psw;if(!k)return;S.settings[k]=e.target.checked;S.settings.updatedAt=Date.now();save()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&A&&!wake)lockWake()});

/* ---------- boot ---------- */
render();loop();
const IDBREADY=idb().then(()=>store("readonly",st=>st.getAll())).then(r=>{r=r||[];TRACKS=r.filter(t=>t.kind!=="tab");TABS=r.filter(t=>t.kind==="tab");refreshIf("audio");refreshIf("notes")});IDBREADY.then(()=>syncSongAssets(),()=>{}).catch(()=>{AU.noDb=true});
if(A)openSession();
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  claude.use("downloads").then(d=>{downloads=d}).catch(()=>{});
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!d||!u)return;const id=await u.id();if(!id)return;
  docRef=d.doc("data/users/"+id+"/state");
  const snap=await docRef.get();
  if(snap.exists){const remote=(snap.data()||{}).state;if(remote&&remote.version===1){const wasDefault=M.cfg===S.settings.metro;S=merge(S,remote);fixSettings();if(wasDefault)M.cfg=S.settings.metro;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}applyTheme()}}
  syncState="synced";await push();syncSongAssets();if(!sessionOpen&&!$("#layer").innerHTML)render()}catch(e){syncState="local"}})();
})();
</script>
</body>
