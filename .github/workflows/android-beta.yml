# Android: два канала (src/core/update.js, DECISIONS 2026-10-24). main → dev: релиз «dev», файл Melete-Dev.apk, отдельное
# приложение «Melete DEV» (app.melete.dev). Ветка pre (по слову автора «выпускай»: git push origin main:pre) → релиз «pre»,
# файл Melete-PreRelease.apk (app.melete), тот же файл — и в старый релиз «beta» (Melete-Beta.apk). Последним в релиз
# кладётся метка сборки android-<номер>.ver — по ней приложение видит, что новая сборка выложена целиком.
# Сборка — на серверах GitHub, там уже есть Android SDK.
name: Android APK (dev и pre)

on:
  push:
    branches: [main, pre] # выпускные сборки — только из основной ветки (dev) и ветки pre: ветки чатов перетирали бы общие релизы (CLAUDE.md: несколько чатов)
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true

env:
  MELETE_CHANNEL: ${{ github.ref_name == 'pre' && 'pre' || 'dev' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      # Тяжёлые модели (build/models.json): скачиваются с проверкой sha256, в репозитории их нет.
      # Кэш GitHub Actions по содержимому models.json: без повторной закачки и не зависит от сбоев источников
      - uses: actions/cache@v4
        with:
          path: |
            public/models
          key: models-${{ runner.os }}-${{ hashFiles('build/models.json') }}
      - name: Модели
        run: npm run models

      # dev — отдельное приложение рядом с основным: своё название (applicationId — в build.gradle по MELETE_CHANNEL)
      - name: Название dev-сборки
        if: env.MELETE_CHANNEL == 'dev'
        run: sed -i 's#>Melete</string>#>Melete DEV</string>#g' android/app/src/main/res/values/strings.xml

      - name: Веб-сборка и перенос в Android
        run: |
          npm run build
          npx cap sync android

      # Ключ подписи — из секретов репозитория (в коде его нет): Settings → Secrets and variables → Actions
      - name: Ключ подписи
        env:
          KEY_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::Нет секрета BETA_KEYSTORE_B64 — APK не подписать (см. DECISIONS.md, 2026-10)"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/melete-beta.jks"

      - name: Сборка APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          BETA_KEYSTORE: ${{ runner.temp }}/melete-beta.jks
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          if [ "$MELETE_CHANNEL" = pre ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../Melete-PreRelease.apk
            cp ../Melete-PreRelease.apk ../Melete-Beta.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../Melete-Dev.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Melete-${{ env.MELETE_CHANNEL }}-${{ github.run_number }}
          path: Melete-*.apk

      # Проверка на Android до выкладки: эмулятор (Android 14) ставит APK и открывает; упало — сборка не выкладывается
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Проверка на эмуляторе Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: build/apk-smoke.sh "$(ls Melete-Dev.apk Melete-PreRelease.apk 2>/dev/null | head -1)" ${{ env.MELETE_CHANNEL == 'dev' && 'app.melete.dev' || 'app.melete' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.MELETE_CHANNEL }}-${{ github.run_number }}
          path: |
            smoke.png
            logcat.txt
          if-no-files-found: ignore

      # dev: файл, затем метка сборки (последней — приложение не предложит недокачанное)
      - name: Выложить в релиз «dev»
        if: env.MELETE_CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(node build/whatsnew-notes.mjs dev ${{ github.run_number }} ${GITHUB_SHA::7})"
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title "Melete DEV" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release edit dev --title "Melete DEV" --notes "$NOTES"
          gh release upload dev Melete-Dev.apk --clobber
          N=${{ github.run_number }}; echo "$N" > "android-$N.ver"
          gh release upload dev "android-$N.ver" --clobber
          for a in $(gh release view dev --json assets -q '.assets[].name' | grep -E '^android-[0-9]+\.ver$'); do [ "$a" = "android-$N.ver" ] || gh release delete-asset dev "$a" -y; done

      - name: Выложить в релиз «pre» (и в старый «beta»)
        if: env.MELETE_CHANNEL == 'pre'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PNOTES="$(node build/whatsnew-notes.mjs pre ${{ github.run_number }} ${GITHUB_SHA::7})"
          if ! gh release view pre >/dev/null 2>&1; then
            gh release create pre --prerelease --title "Melete 1.2 Pre-release" --notes "$PNOTES" --target "$GITHUB_SHA"
          fi
          gh release edit pre --title "Melete 1.2 Pre-release" --notes "$PNOTES"
          gh release upload pre Melete-PreRelease.apk --clobber
          N=${{ github.run_number }}; echo "$N" > "android-$N.ver"
          gh release upload pre "android-$N.ver" --clobber
          for a in $(gh release view pre --json assets -q '.assets[].name' | grep -E '^android-[0-9]+\.ver$'); do [ "$a" = "android-$N.ver" ] || gh release delete-asset pre "$a" -y; done
          # метка коммита этой сборки — для отката: «откати pre на pre-N» = git push --force origin pre-N:pre (новая сборка с бóльшим номером, данные остаются)
          git tag -f "pre-$N" "$GITHUB_SHA" && git push -f origin "refs/tags/pre-$N" || true
          NOTES="Бета завершена — это уже предрелиз Melete 1.2, сборка ${{ github.run_number }} (${GITHUB_SHA::7}). Новая ссылка: релиз «pre», файл Melete-PreRelease.apk"
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --title "Melete Beta" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release edit beta --title "Melete Beta" --notes "$NOTES"
          gh release upload beta Melete-Beta.apk --clobber
          # прежнее имя файла (до названия Melete) — убрать, чтобы не скачали старую сборку
          gh release delete-asset beta Practice-Beta.apk -y 2>/dev/null || true
