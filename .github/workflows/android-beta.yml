# Предрелиз для Android: собирает APK и кладёт его в релиз «pre» (releases/download/pre/Melete-PreRelease.apk);
# тот же файл — и в старый релиз «beta» (releases/download/beta/Melete-Beta.apk), чтобы старая ссылка давала свежую сборку.
# Сборка — на серверах GitHub, там уже есть Android SDK.
name: Android pre-release APK

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-beta
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Веб-сборка и перенос в Android
        run: |
          npm run build
          npx cap sync android

      # Ключ подписи — из секретов репозитория (в коде его нет): Settings → Secrets and variables → Actions
      - name: Ключ подписи
        env:
          KEY_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::Нет секрета BETA_KEYSTORE_B64 — APK не подписать (см. DECISIONS.md, 2026-10)"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/melete-beta.jks"

      - name: Сборка APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          BETA_KEYSTORE: ${{ runner.temp }}/melete-beta.jks
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Melete-PreRelease.apk
          cp ../Melete-PreRelease.apk ../Melete-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Melete-PreRelease-${{ github.run_number }}
          path: Melete-PreRelease.apk

      - name: Выложить в релиз «pre» (и в старый «beta»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PNOTES="Melete 1.2 — предрелиз, сборка ${{ github.run_number }} (${GITHUB_SHA::7}, ветка ${GITHUB_REF_NAME}). Скачать на телефон: Melete-PreRelease.apk. С 16.10.2026 новая подпись: если стояла сборка раньше — сначала копия данных (Профиль → Данные), удалить старое приложение, поставить это. Веб-версия — отдельная, по ссылке в README."
          if ! gh release view pre >/dev/null 2>&1; then
            gh release create pre --prerelease --title "Melete 1.2 Pre-release" --notes "$PNOTES" --target "$GITHUB_SHA"
          fi
          gh release edit pre --title "Melete 1.2 Pre-release" --notes "$PNOTES"
          gh release upload pre Melete-PreRelease.apk --clobber
          NOTES="Бета завершена — это уже предрелиз Melete 1.2, сборка ${{ github.run_number }} (${GITHUB_SHA::7}). Новая ссылка: релиз «pre», файл Melete-PreRelease.apk"
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --title "Melete Beta" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release edit beta --title "Melete Beta" --notes "$NOTES"
          gh release upload beta Melete-Beta.apk --clobber
          # прежнее имя файла (до названия Melete) — убрать, чтобы не скачали старую сборку
          gh release delete-asset beta Practice-Beta.apk -y 2>/dev/null || true
