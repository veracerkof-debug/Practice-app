# Версия для Windows (Tauri 2), два канала (src/core/update.js): main → релиз «dev», Melete-Dev-Setup.exe — отдельная
# программа «Melete DEV» (app.melete.dev, tauri.dev.conf.json); ветка pre (по слову автора) → релиз «pre», Melete-Setup.exe.
# Последней в релиз кладётся метка сборки windows-<номер>.ver — по ней программа видит, что сборка выложена целиком.
# Сборка — на серверах GitHub (Windows, Rust, WebView2 уже есть).
# Установка — для текущего пользователя, без прав администратора; нужен Windows 10/11 (WebView2 — часть системы,
# при его отсутствии установщик скачает его).
name: Windows (dev и pre)

on:
  push:
    branches: [main, pre] # выпускные сборки — только из основной ветки (dev) и ветки pre: ветки чатов перетирали бы общие релизы (CLAUDE.md: несколько чатов)
    paths-ignore: ['**.md', 'docs/**', 'android/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref_name }}
  cancel-in-progress: true

env:
  MELETE_CHANNEL: ${{ github.ref_name == 'pre' && 'pre' || 'dev' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      # Тяжёлые модели (build/models.json): скачиваются с проверкой sha256, в репозитории их нет.
      # Кэш GitHub Actions по содержимому models.json: без повторной закачки и не зависит от сбоев источников
      - uses: actions/cache@v4
        with:
          path: |
            public/models
            src-tauri/models
          key: models-${{ runner.os }}-${{ hashFiles('build/models.json') }}
      - name: Модели
        run: npm run models

      # whisper.cpp собирается cmake-ом, привязки Rust генерирует bindgen прямо на Windows (готовые в крейте сделаны
      # под Linux и на MSVC не проходят проверку размеров структур) — ему нужен libclang из LLVM образа
      - name: LLVM для bindgen
        shell: bash
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then choco install llvm -y --no-progress; fi
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # beforeBuildCommand в tauri.conf.json собирает веб-часть (npm run build)
      - name: Сборка установщика
        shell: bash
        run: |
          if [ "$MELETE_CHANNEL" = dev ]; then npx tauri build --ci --config src-tauri/tauri.dev.conf.json; else npx tauri build --ci; fi

      - name: Переименовать
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          if [ "$MELETE_CHANNEL" = pre ]; then OUT=Melete-Setup.exe; else OUT=Melete-Dev-Setup.exe; fi
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Melete-${{ env.MELETE_CHANNEL }}-Setup-${{ github.run_number }}
          path: ${{ env.OUT }}

      # файл, затем метка сборки (последней — программа не предложит недокачанное)
      - name: Выложить в релиз канала
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$MELETE_CHANNEL
          if [ "$TAG" = pre ]; then TITLE="Melete 1.2 Pre-release"; else TITLE="Melete DEV"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TITLE" --notes "$(node build/whatsnew-notes.mjs $TAG ${{ github.run_number }})" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$OUT" --clobber
          N=${{ github.run_number }}; echo "$N" > "windows-$N.ver"
          gh release upload "$TAG" "windows-$N.ver" --clobber
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '^windows-[0-9]+\.ver$'); do [ "$a" = "windows-$N.ver" ] || gh release delete-asset "$TAG" "$a" -y; done
